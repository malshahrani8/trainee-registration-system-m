{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 800px; margin: 30px auto;">
    <h1 class="page-title">
        <i class="fas fa-calendar-plus ms-2"></i> {{ title }}
    </h1>

    <form method="POST">
        {{ form.hidden_tag() }}
        
        <div class="card card-tvtc">
            <div class="card-header">
                <i class="fas fa-info-circle ms-2"></i> معلومات الجلسة
            </div>
            <div class="card-body">
                <!-- المقرر -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        <i class="fas fa-book text-tvtc ms-1"></i> المقرر *
                    </label>
                    <select name="course_name" class="form-select" required>
                        <option value="">-- اختر المقرر --</option>
                        <option value="مقدمة تطبيقات الحاسب" {% if form.course_name.data == 'مقدمة تطبيقات الحاسب' %}selected{% endif %}>مقدمة تطبيقات الحاسب</option>
                        <option value="أساسيات البرمجة" {% if form.course_name.data == 'أساسيات البرمجة' %}selected{% endif %}>أساسيات البرمجة</option>
                        <option value="قواعد البيانات" {% if form.course_name.data == 'قواعد البيانات' %}selected{% endif %}>قواعد البيانات</option>
                        <option value="أنظمة التشغيل" {% if form.course_name.data == 'أنظمة التشغيل' %}selected{% endif %}>أنظمة التشغيل</option>
                        <option value="أمن الشبكات" {% if form.course_name.data == 'أمن الشبكات' %}selected{% endif %}>أمن الشبكات</option>
                    </select>
                </div>
                
                <!-- التخصص -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        <i class="fas fa-graduation-cap text-tvtc ms-1"></i> التخصص *
                    </label>
                    <select name="specialization" class="form-select" required>
                        <option value="">-- اختر التخصص --</option>
                        <option value="دعم فني" {% if form.specialization.data == 'دعم فني' %}selected{% endif %}>دعم فني</option>
                        <option value="شبكات الحاسب" {% if form.specialization.data == 'شبكات الحاسب' %}selected{% endif %}>شبكات الحاسب</option>
                        <option value="محاسبة" {% if form.specialization.data == 'محاسبة' %}selected{% endif %}>محاسبة</option>
                        <option value="إدارة مكتبية" {% if form.specialization.data == 'إدارة مكتبية' %}selected{% endif %}>إدارة مكتبية</option>
                        <option value="ميكانيكا" {% if form.specialization.data == 'ميكانيكا' %}selected{% endif %}>ميكانيكا</option>
                        <option value="إلكترونيات" {% if form.specialization.data == 'إلكترونيات' %}selected{% endif %}>إلكترونيات</option>
                    </select>
                </div>
                
                <!-- ❌ تم حذف ترتيب الجلسة -->
                
                <!-- التاريخ والوقت -->
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-calendar-day text-tvtc ms-1"></i> تاريخ الجلسة *
                        </label>
                        <input type="date" name="session_date" class="form-control" 
                               value="{{ form.session_date.data.strftime('%Y-%m-%d') if form.session_date.data else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-clock text-tvtc ms-1"></i> وقت الجلسة *
                        </label>
                        <input type="time" name="session_time" class="form-control" 
                               value="{{ form.session_time.data.strftime('%H:%M') if form.session_time.data else '' }}" required>
                    </div>
                </div>
                
                <!-- المعمل والسعة -->
                <div class="row">
                    <div class="col-md-8 mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-map-marker-alt text-tvtc ms-1"></i> رقم المعمل / مكان الجلسة *
                        </label>
                        <input type="text" name="location" class="form-control" 
                               value="{{ form.location.data or '' }}" 
                               placeholder="مثال: معمل 201 - مبنى A" required>
                    </div>
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-bold">
                            <i class="fas fa-users text-tvtc ms-1"></i> السعة القصوى *
                        </label>
                        <input type="number" name="max_capacity" class="form-control" 
                               value="{{ form.max_capacity.data or 20 }}" 
                               min="1" max="50" required>
                    </div>
                </div>
                
                <!-- الأزرار -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-tvtc">
                        <i class="fas fa-save ms-2"></i> حفظ الجلسة
                    </button>
                    <a href="{{ url_for('admin_sessions') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-times ms-2"></i> إلغاء
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
